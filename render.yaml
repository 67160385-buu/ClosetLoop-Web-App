# Render Infrastructure as Code (Blueprint)
# Deploy ClosetLoop on Render: Database + FastAPI Backend + React Vite Frontend

databases:
  - name: closetloop-db
    databaseName: closetloop
    user: closetloop
    plan: free
    region: singapore

services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: closetloop-backend
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: closetloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173

  # 2. React Vite Frontend Static Site (ไม่ใส่ region และ plan)
  - type: web
    name: closetloop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: closetloop-backend
          property: host